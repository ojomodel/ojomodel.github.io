    <use href="#olu-reactor-mount" transform="rotate(198 300 300)"/>
    <use href="#olu-reactor-mount" transform="rotate(234 300 300)"/>
    <use href="#olu-reactor-mount" transform="rotate(270 300 300)"/>
    <use href="#olu-reactor-mount" transform="rotate(306 300 300)"/>
    <use href="#olu-reactor-mount" transform="rotate(342 300 300)"/>
    <use href="#olu-reactor-coil"/>
    <use href="#olu-reactor-coil" transform="rotate(36 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(72 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(108 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(144 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(180 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(216 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(252 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(288 300 300)"/>
    <use href="#olu-reactor-coil" transform="rotate(324 300 300)"/>
  </g>

  <g class="reactor-inner-housing">
    <circle cx="300" cy="300" r="143" fill="#0c0f12" stroke="#aab2b8" stroke-width="2"/>
    <circle cx="300" cy="300" r="138" stroke="#333f48" stroke-width="1.2"/>
    <circle cx="300" cy="300" r="132" stroke="#667680" stroke-width="1.2"/>
    <use href="#olu-reactor-vent"/>
    <use href="#olu-reactor-vent" transform="rotate(15 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(30 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(45 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(60 300 300)"/>
