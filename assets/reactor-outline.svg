    <use href="#olu-reactor-vent" transform="rotate(315 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(330 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(345 300 300)"/>
    <circle cx="300" cy="300" r="109" fill="#0a0d10" stroke="#8c9ba6" stroke-width="1.8"/>
    <circle class="reactor-lit" cx="300" cy="300" r="104" stroke="#c1c9cf" stroke-width="3"/>
    <circle cx="300" cy="300" r="97" stroke="#46545f" stroke-width="1"/>
    <circle class="reactor-lit" cx="300" cy="300" r="91" stroke="#8797a2" stroke-width="1.8" stroke-dasharray="158 32.59" transform="rotate(-90 300 300)"/>
    <use href="#olu-reactor-hub-arm"/>
    <use href="#olu-reactor-hub-arm" transform="rotate(120 300 300)"/>
    <use href="#olu-reactor-hub-arm" transform="rotate(240 300 300)"/>
