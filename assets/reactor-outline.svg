    <circle cx="300" cy="300" r="201" stroke="#67737c" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="189" stroke="#46545f" stroke-width="2" stroke-dasharray="78 40.75" transform="rotate(-90 300 300)"/>
    <circle class="reactor-lit" cx="300" cy="300" r="151" stroke="#929da7" stroke-width="2.3"/>
    <use href="#olu-reactor-mount" transform="rotate(18 300 300)"/>
    <use href="#olu-reactor-mount" transform="rotate(54 300 300)"/>
    <use href="#olu-reactor-mount" transform="rotate(90 300 300)"/>
    <use href="#olu-reactor-mount" transform="rotate(126 300 300)"/>
