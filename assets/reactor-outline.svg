<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" aria-labelledby="reactor-outline-title reactor-outline-description">
  <title id="reactor-outline-title">Proof that Oluwaseun has a heart</title>
  <desc id="reactor-outline-description">An original silver line-art reactor with ten radial coils, concentric mechanical rings, and a small triangular hub. The outer ring reads Proof that Oluwaseun has a heart.</desc>
  <defs>
    <path id="olu-reactor-letter-top" d="M60 300A240 240 0 0 1 540 300"/>
    <path id="olu-reactor-letter-bottom" d="M60 300A240 240 0 0 0 540 300"/>
    <g id="olu-reactor-coil" stroke-linecap="round" stroke-linejoin="round">
      <path d="M282 102Q300 96 318 102L322 154Q300 162 278 154Z" fill="#0c0d0e" stroke="#747b80" stroke-width="1.6"/>
      <path d="M282 108Q300 102 318 108M281 114Q300 108 319 114M281 120Q300 114 319 120M280 126Q300 120 320 126M280 132Q300 126 320 132M279 138Q300 132 321 138M279 144Q300 138 321 144M278 150Q300 144 322 150" stroke="#92999e" stroke-width="1.6"/>
      <path d="M286 102V97H314V102M284 156V162H316V156" stroke="#bec3c7" stroke-width="1.9"/>
      <path class="reactor-lit" d="M290 99V94M310 99V94M290 162V170M310 162V170" stroke="#929ca4" stroke-width="2"/>
      <path d="M286 106L283 151M314 106L317 151" stroke="#363d42" stroke-width="1.2"/>
    </g>
    <g id="olu-reactor-mount" stroke-linecap="round" stroke-linejoin="round">
      <path d="M291 105L288 142L295 154H305L312 142L309 105" fill="#0a0b0c" stroke="#515a61" stroke-width="1.3"/>
      <circle cx="300" cy="119" r="5.5" fill="#111416" stroke="#879198" stroke-width="1.4"/>
      <path d="M297 119H303" stroke="#9ba3a9" stroke-width="1.1"/>
      <path d="M296 133V144H304V133" stroke="#333d44" stroke-width="1.1"/>
    </g>
    <g id="olu-reactor-vent">
      <rect x="296.6" y="173" width="6.8" height="13" rx="2.7" fill="#090b0d" stroke="#525e66" stroke-width="1"/>
      <path d="M299 176V182" stroke="#1b242a" stroke-width="1.1"/>
    </g>
    <g id="olu-reactor-hub-arm" stroke-linejoin="round">
      <path d="M291 199H309L313 210L307 225H293L287 210Z" fill="#101316" stroke="#7b868f" stroke-width="1.3"/>
      <path class="reactor-lit" d="M296 204H304L307 210L303 219H297L293 210Z" stroke="#abb4bc" stroke-width="1.8"/>
    </g>
  </defs>

  <!-- The inscription is part of the object, with no stand or external artwork. -->
  <g class="reactor-inscription-ring">
    <circle cx="300" cy="300" r="268" fill="#0b0c0d" stroke="#9ea5aa" stroke-width="2"/>
    <circle cx="300" cy="300" r="263" stroke="#414a51" stroke-width=".9"/>
    <circle cx="300" cy="300" r="258" stroke="#222a30" stroke-width=".7"/>
    <circle cx="300" cy="300" r="215" fill="#090b0d" stroke="#9ba4aa" stroke-width="1.8"/>
    <circle cx="300" cy="300" r="220" stroke="#343e46" stroke-width=".8"/>
    <g class="reactor-inscription" fill="#c0c6ca" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" letter-spacing="3">
      <text><textPath href="#olu-reactor-letter-top" startOffset="50%" text-anchor="middle">PROOF THAT OLUWASEUN</textPath></text>
      <text dy="9"><textPath href="#olu-reactor-letter-bottom" startOffset="50%" text-anchor="middle">HAS A HEART</textPath></text>
    </g>
    <g stroke="#818b93" stroke-width="1.3">
      <circle cx="58" cy="300" r="5.5" fill="#15191c"/>
      <circle cx="542" cy="300" r="5.5" fill="#15191c"/>
      <path d="M54.5 300H61.5M538.5 300H545.5"/>
    </g>
    <path d="M38 288H43M38 312H43M557 288H562M557 312H562" stroke="#47535c" stroke-width="1.2"/>
  </g>

  <g class="reactor-outer-mechanism">
