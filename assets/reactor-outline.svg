    <use href="#olu-reactor-vent" transform="rotate(120 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(135 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(150 300 300)"/>
    <use href="#olu-reactor-vent" transform="rotate(165 300 300)"/>
